license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Traduz automaticamente textos de mods para pt-BR, preserva nomes e reutiliza cache local. Tradução local sob demanda com controle de recursos, ou API DeepL quando configurada.
'''

[[mixins]]
config="modtranslator.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[26.1.2,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
