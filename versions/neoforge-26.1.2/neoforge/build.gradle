plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'traduzmods-neoforge'
}

sourceSets.main.java.srcDir('../common/src/main/java')

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
    ]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Minecraft 26.1.2 ships named classes; no legacy obfuscation refmap is generated.
    options.compilerArgs.add('-proc:none')
}

jar {
    from('../LICENSE')
}

// Both editions use the same production code and mod ID. Build one edition at a time.
def translationEdition = providers.gradleProperty('edition').getOrElse('lite')
if (!(translationEdition in ['lite', 'normal'])) { throw new GradleException('edition must be lite or normal') }
processResources {
    inputs.property 'edition', translationEdition
    filesMatching('traduzmods-edition.properties') {
        filter { line -> 'edition=' + translationEdition }
    }
}

// Include Minecraft and NeoForge dependencies in the standalone test source set.
neoForge.addModdingDependenciesTo(sourceSets.test)

// Standalone integration runner; no external translation service is used.
tasks.test { enabled = false }
tasks.register('integrationTest', JavaExec) {
    notCompatibleWithConfigurationCache('Integration fixtures require a fresh directory for each run.')
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.modtranslator.core.TranslationServiceIntegrationTest'
    args layout.buildDirectory.dir('integration-' + System.currentTimeMillis()).get().asFile.absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Optional integration check against an installed GuideMe version, never a production dependency.
tasks.register('guideMeIntegration', JavaExec) {
    notCompatibleWithConfigurationCache('Optional installed-mod fixture uses a fresh directory.')
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    if (providers.gradleProperty('guideMeJar').isPresent()) classpath += files(providers.gradleProperty('guideMeJar').get())
    mainClass = 'com.modtranslator.core.GuideMeApiIntegration'
    args layout.buildDirectory.dir('guideme-integration-' + System.currentTimeMillis()).get().asFile.absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
